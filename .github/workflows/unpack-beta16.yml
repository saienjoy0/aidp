name: Recover Beta16 source

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/unpack-beta16.yml
      - archive/AIDP_ChatGPT_Bridge_v0.7.9_beta16_one_click.zip.b64.part*

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Restore complete Beta16 source from Git history
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extension /tmp/aidp_beta16_history
          mkdir -p extension /tmp/aidp_beta16_history
          git archive 896353e84474dba4e892e19885c34cd2f8115ae5 -- 'AIDP_ChatGPT_Bridge_v0.7.9_beta16_one_click (1)' \
            | tar -x -C /tmp/aidp_beta16_history
          cp -a '/tmp/aidp_beta16_history/AIDP_ChatGPT_Bridge_v0.7.9_beta16_one_click (1)/.' extension/

          required=(manifest.json service_worker.js content.js sidepanel.html sidepanel.js patch_engine.js offscreen.html offscreen.js ruleset.json)
          for f in "${required[@]}"; do
            test -f "extension/$f" || { echo "Missing required file: $f"; exit 1; }
          done

          echo 'Recovered files:'
          find extension -maxdepth 2 -type f -printf '%P\n' | sort

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find extension -type f -name '*.js' -print0)
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('extension').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
              print('JSON OK:', p)
          PY
          if [[ -f extension/tests/patch_engine.test.js ]]; then node extension/tests/patch_engine.test.js; fi
          if [[ -f extension/tests/structural_patch_engine.test.js ]]; then node extension/tests/structural_patch_engine.test.js; fi
          if [[ -f extension/tests/beta16_static.test.js ]]; then node extension/tests/beta16_static.test.js; fi

      - name: Commit recovered source to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- extension
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Recover complete Beta16 extension source'
          target_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git push origin HEAD:"$target_branch"
