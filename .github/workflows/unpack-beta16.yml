name: Beta18 Bootstrap

on:
  pull_request:
    branches:
      - aidp-beta17-recovery
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-beta18:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'aidp-beta18-structural')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aidp-beta18-structural
          fetch-depth: 0

      - name: Apply staged Beta18 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/beta18_extension.patch.gz.b64 | gzip -dc > /tmp/beta18.patch
          git apply --check /tmp/beta18.patch
          git apply /tmp/beta18.patch
          rm .github/beta18_extension.patch.gz.b64

          cat > .github/workflows/unpack-beta16.yml <<'YAML'
          name: Beta18 CI

          on:
            workflow_dispatch:
            pull_request:
              branches:
                - main
                - aidp-beta17-recovery

          permissions:
            contents: read

          jobs:
            beta18:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4

                - name: Static and unit tests
                  shell: bash
                  run: |
                    set -euo pipefail
                    while IFS= read -r -d '' f; do node --check "$f"; done < <(find extension -type f -name '*.js' -print0)
                    python - <<'PY'
                    import json
                    from pathlib import Path
                    for p in Path('extension').rglob('*.json'):
                        json.loads(p.read_text(encoding='utf-8'))
                        print('JSON OK:', p)
                    PY
                    node extension/tests/patch_engine.test.js
                    node extension/tests/structural_patch_engine.test.js
                    node extension/tests/recovery_engine.test.js
                    node extension/tests/beta18_static.test.js
          YAML

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Beta18 native structural adapter'
          git push origin HEAD:aidp-beta18-structural
