name: Unpack Beta16 source

on:
  workflow_dispatch:
  push:
    branches:
      - aidp-beta17-recovery
    paths:
      - .github/workflows/unpack-beta16.yml
      - archive/AIDP_ChatGPT_Bridge_v0.7.9_beta16_one_click.zip.b64.part*
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/unpack-beta16.yml
      - archive/AIDP_ChatGPT_Bridge_v0.7.9_beta16_one_click.zip.b64.part*

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Reconstruct and extract Beta16
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/aidp_beta16 extension
          mkdir -p /tmp/aidp_beta16 extension
          cat archive/AIDP_ChatGPT_Bridge_v0.7.9_beta16_one_click.zip.b64.part* > /tmp/beta16.zip.b64
          base64 --decode /tmp/beta16.zip.b64 > /tmp/beta16.zip
          echo '093f2267dde0b8b923ea4ec9e0b79bfc7eace049da047da4e82d514f91788887  /tmp/beta16.zip' | sha256sum -c -
          unzip -t /tmp/beta16.zip
          unzip -q /tmp/beta16.zip -d /tmp/aidp_beta16

          mapfile -t top_entries < <(find /tmp/aidp_beta16 -mindepth 1 -maxdepth 1 -printf '%p\n')
          if [[ ${#top_entries[@]} -eq 1 && -d "${top_entries[0]}" ]]; then
            cp -a "${top_entries[0]}/." extension/
          else
            cp -a /tmp/aidp_beta16/. extension/
          fi

          test -f extension/manifest.json
          echo 'Recovered files:'
          find extension -maxdepth 2 -type f -printf '%P\n' | sort

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find extension -type f -name '*.js' -print0)
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('manifest.json', 'ruleset.json', 'sample_patch.json'):
              p = Path('extension') / name
              if p.exists():
                  json.loads(p.read_text(encoding='utf-8'))
                  print('JSON OK:', p)
          PY

      - name: Upload recovered source artifact
        uses: actions/upload-artifact@v4
        with:
          name: aidp-beta16-source
          path: extension
          if-no-files-found: error

      - name: Commit recovered source to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- extension
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Recover Beta16 extension source'
          target_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git push origin HEAD:"$target_branch"
